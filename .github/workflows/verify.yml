name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Verify frontend
        run: |
          bun run test
          bun run lint
          bun run build
          bun run format
          bun audit
      - name: Verify backend
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --future-incompat-report
          cargo rustc --locked -p block -- -D warnings
          cargo test --locked --manifest-path vendor/block/Cargo.toml
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build the development app bundle
        run: bun run tauri build --debug --bundles app
      - name: Check whitespace
        run: git diff --check
